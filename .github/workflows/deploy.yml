
name: Website CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Website
        run: |
          test -f index.html
          echo "Website validation passed!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy Website
        uses: actions/deploy-pages@v4
