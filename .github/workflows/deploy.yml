name: Website CI/CD

on:
  push: 
    branches: [main]
    workflow_dispatch:

    permissions:
      contents: read
      pages: write
      id-token: write

    jobs:
      validate:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout Repository
            uses: actions/checkout@v6

          - name: Check HTML File
            run: test -f index.HTML

    deploy:
      needs: validate
      runs-on: ubuntu-latest

    environment:
      name: github-pages

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Github pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
